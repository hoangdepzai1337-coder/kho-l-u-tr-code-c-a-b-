<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kho Code</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      font-family: monospace;
    }

    .bg {
      position: fixed;
      top: -20px; left: -20px;
      width: calc(100% + 40px);
      height: calc(100% + 40px);
      background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?w=3840');
      background-size: cover;
      background-position: center;
      transition: transform 0.1s ease-out;
      z-index: -1;
    }

    .sidebar-wrap {
      position: fixed;
      top: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      z-index: 100;
    }
    .sidebar-wrap.left { left: 0; }
    .sidebar-wrap.right { right: 0; }

    .arrow {
      width: 28px;
      height: 60px;
      background: rgba(0,255,204,0.15);
      border: 1px solid #00ffcc55;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #00ffcc;
      font-size: 16px;
      backdrop-filter: blur(6px);
      user-select: none;
      flex-shrink: 0;
    }
    .sidebar-wrap.left .arrow { border-radius: 0 8px 8px 0; }
    .sidebar-wrap.right .arrow { border-radius: 8px 0 0 8px; }
    .sidebar-wrap.left .arrow::before { content: '▶'; }
    .sidebar-wrap.left:hover .arrow::before { content: '◀'; }
    .sidebar-wrap.right .arrow::before { content: '◀'; }
    .sidebar-wrap.right:hover .arrow::before { content: '▶'; }

    .sidebar {
      width: 0;
      height: 100vh;
      background: rgba(10,10,20,0.85);
      backdrop-filter: blur(14px);
      overflow: hidden;
      transition: width 0.3s cubic-bezier(0.4,0,0.2,1);
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .sidebar-wrap.left .sidebar { border-right: 1px solid #00ffcc33; order: -1; }
    .sidebar-wrap.right .sidebar { border-left: 1px solid #00ffcc33; }
    .sidebar-wrap:hover .sidebar { width: 280px; padding: 24px 12px; overflow-y: auto; }

    .sidebar h2 {
      color: #00ffcc;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid #00ffcc33;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s 0.2s;
    }
    .sidebar-wrap:hover .sidebar h2 { opacity: 1; }

    .car-item {
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #00ffcc22;
      cursor: pointer;
      margin-bottom: 10px;
      flex-shrink: 0;
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.25s, transform 0.25s, border 0.2s;
      white-space: nowrap;
    }
    .sidebar-wrap.right .car-item { transform: translateX(10px); }
    .sidebar-wrap:hover .car-item { opacity: 1; transform: translateX(0); }
    .sidebar-wrap:hover .car-item:nth-child(2) { transition-delay: 0.08s; }
    .sidebar-wrap:hover .car-item:nth-child(3) { transition-delay: 0.14s; }
    .sidebar-wrap:hover .car-item:nth-child(4) { transition-delay: 0.20s; }
    .sidebar-wrap:hover .car-item:hover { border: 1px solid #00ffcc; transform: scale(1.02) !important; }

    .car-item img { width: 100%; height: 150px; object-fit: cover; display: block; }
    .car-item span {
      display: block; color: #00ffcc;
      font-size: 11px; padding: 6px 8px;
      background: rgba(0,0,0,0.6);
    }

    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    .title { color: #00ffcc; font-size: 32px; letter-spacing: 6px; text-shadow: 0 0 20px #00ffcc88; }
    .subtitle { color: #ffffff66; font-size: 13px; letter-spacing: 2px; }

    /* POPUP */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      animation: fadeIn 0.25s ease;
    }
    .popup-overlay.open { display: flex; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .popup {
      width: 90vw;
      max-width: 900px;
      max-height: 90vh;
      background: rgba(10,10,25,0.97);
      border: 1px solid #00ffcc44;
      border-radius: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .popup-header {
      position: relative;
      height: 320px;
      overflow: hidden;
      border-radius: 16px 16px 0 0;
      flex-shrink: 0;
    }
    .popup-header img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .popup-header-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 20px 24px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
    }
    .popup-header-overlay h1 {
      color: #00ffcc;
      font-size: 26px;
      letter-spacing: 3px;
    }
    .popup-header-overlay p {
      color: #ffffff88;
      font-size: 13px;
      margin-top: 4px;
    }

    .popup-close {
      position: absolute;
      top: 14px; right: 14px;
      width: 36px; height: 36px;
      background: rgba(0,0,0,0.7);
      border: 1px solid #00ffcc55;
      border-radius: 50%;
      color: #00ffcc;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .popup-close:hover { background: #00ffcc22; }

    .popup-body { padding: 24px; }

    .spec-section { margin-bottom: 24px; }
    .spec-section h3 {
      color: #00ffcc;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #00ffcc22;
    }

    .spec-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .spec-item {
      background: rgba(0,255,204,0.04);
      border: 1px solid #00ffcc15;
      border-radius: 8px;
      padding: 10px 14px;
    }
    .spec-item .label {
      color: #ffffff55;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .spec-item .value {
      color: #ffffff;
      font-size: 13px;
    }
  </style>

            { label: 'Kiểm soát lực kéo', value: 'Variable Drift Control (VDC)' },
            { label: 'Khung bảo vệ', value: 'Carbon MonoCage Roll Structure' },
            { label: 'Camera', value: 'Camera lùi + cảm biến' },
          ],
        }
      }
    };

    function openCar(id) {
      const car = cars[id];
      document.getElementById('popup-img').src = car.img;
      document.getElementById('popup-name').textContent = car.name;
      document.getElementById('popup-sub').textContent = car.sub;

      let html = '';
      for (const [section, items] of Object.entries(car.specs)) {
        html += `<div class="spec-section"><h3>${section}</h3><div class="spec-grid">`;
        items.forEach(item => {
          html += `<div class="spec-item"><div class="label">${item.label}</div><div class="value">${item.value}</div></div>`;
        });
        html += `</div></div>`;
      }
      document.getElementById('popup-body').innerHTML = html;
      document.getElementById('popup-overlay').classList.add('open');
    }

    function closePopup(e) {
      if (e.target === document.getElementById('popup-overlay')) {
        document.getElementById('popup-overlay').classList.remove('open');
      }
    }

    function closePopupDirect() {
      document.getElementById('popup-overlay').classList.remove('open');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePopupDirect();
    });
  </script>
</body>
</html>
