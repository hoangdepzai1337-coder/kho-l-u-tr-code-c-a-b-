<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kho Code</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      font-family: monospace;
    }

    .bg {
      position: fixed;
      top: -20px;
      left: -20px;
      width: calc(100% + 40px);
      height: calc(100% + 40px);
      background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?w=3840');
      background-size: cover;
      background-position: center;
      transition: transform 0.1s ease-out;
      z-index: -1;
    }

    /* SIDEBAR WRAPPER */
    .sidebar-wrap {
      position: fixed;
      top: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      z-index: 100;
    }

    .sidebar-wrap.left { left: 0; }
    .sidebar-wrap.right { right: 0; }

    /* MŨI TÊN */
    .arrow {
      width: 28px;
      height: 60px;
      background: rgba(0, 255, 204, 0.15);
      border: 1px solid #00ffcc55;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #00ffcc;
      font-size: 16px;
      transition: background 0.2s;
      backdrop-filter: blur(6px);
      user-select: none;
      flex-shrink: 0;
    }

    .sidebar-wrap.left .arrow { border-radius: 0 8px 8px 0; }
    .sidebar-wrap.right .arrow { border-radius: 8px 0 0 8px; }

    .arrow:hover { background: rgba(0, 255, 204, 0.3); }

    /* SIDEBAR */
    .sidebar {
      width: 0;
      height: 100vh;
      background: rgba(10, 10, 20, 0.85);
      backdrop-filter: blur(14px);
      overflow: hidden;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .sidebar-wrap.left .sidebar { border-right: 1px solid #00ffcc33; order: -1; }
    .sidebar-wrap.right .sidebar { border-left: 1px solid #00ffcc33; }

    .sidebar-wrap:hover .sidebar { width: 280px; padding: 24px 12px; }

    /* Mũi tên đổi chiều khi mở */
    .sidebar-wrap.left:hover .arrow::before { content: '◀'; }
    .sidebar-wrap.left .arrow::before { content: '▶'; }
    .sidebar-wrap.right:hover .arrow::before { content: '▶'; }
    .sidebar-wrap.right .arrow::before { content: '◀'; }

    .sidebar h2 {
      color: #00ffcc;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid #00ffcc33;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s 0.2s;
    }

    .sidebar-wrap:hover .sidebar h2 { opacity: 1; }

    .car-item {
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #00ffcc22;
      cursor: pointer;
      transition: border 0.2s, transform 0.2s;
      margin-bottom: 10px;
      flex-shrink: 0;
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.25s, transform 0.25s, border 0.2s;
      white-space: nowrap;
    }

    .sidebar-wrap.right .car-item { transform: translateX(10px); }

    .sidebar-wrap:hover .car-item {
      opacity: 1;
      transform: translateX(0);
    }

    .sidebar-wrap:hover .car-item:nth-child(2) { transition-delay: 0.08s; }
    .sidebar-wrap:hover .car-item:nth-child(3) { transition-delay: 0.14s; }
    .sidebar-wrap:hover .car-item:nth-child(4) { transition-delay: 0.20s; }
    .sidebar-wrap:hover .car-item:nth-child(5) { transition-delay: 0.26s; }

    .car-item:hover {
      border: 1px solid #00ffcc;
      transform: scale(1.02) !important;
    }

    .car-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }

    .car-item span {
      display: block;
      color: #00ffcc;
      font-size: 11px;
      padding: 6px 8px;
      background: rgba(0,0,0,0.6);
    }

    /* CENTER */
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .title {
      color: #00ffcc;
      font-size: 32px;
      letter-spacing: 6px;
      text-shadow: 0 0 20px #00ffcc88;
    }

    .subtitle {
      color: #ffffff66;
      font-size: 13px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <!-- SIDEBAR TRÁI -->
  <div class="sidebar-wrap left">
    <div class="sidebar">
      <h2>🚗 Xe Tao</h2>
      <div class="car-item">
        <img src="https://www.topgear.com/sites/default/files/cars-car/image/2024/10/1-Lamborghini-Urus-SE-review-2024.jpg?w=1280&h=720" alt="Lamborghini Urus">
        <span>Lamborghini Urus</span>
      </div>
      <div class="car-item">
        <img src="https://xehay.vn/uploads/images/2024/10/01/Xehay_SF90%20Stradale_021024_3.jpg" alt="Ferrari SF90">
        <span>Ferrari SF90</span>
      </div>
    </div>
    <div class="arrow"></div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="title">KHO CODE</div>
    <div class="subtitle">// by hoangdepzai1337</div>
  </div>

  <!-- SIDEBAR PHẢI -->
  <div class="sidebar-wrap right">
    <div class="arrow"></div>
    <div class="sidebar">
      <h2>🏎️ Dream Car</h2>
      <div class="car-item">
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/18/Bugatti_Chiron_1.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="Bugatti Chiron">
        <span>Bugatti Chiron</span>
      </div>
      <div class="car-item">
        <img src="https://imageio.forbes.com/specials-images/imageserve/627be3167b47f51af48ee821/McLaren-765LT-Spider--1/960x0.jpg?format=jpg&width=960" alt="McLaren P1">
        <span>McLaren P1</span>
      </div>
    </div>
  </div>

  <script>
    const bg = document.getElementById('bg');
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      bg.style.transform = `translate(${x}px, ${y}px)`;
    });
  </script>
</body>
</html>
