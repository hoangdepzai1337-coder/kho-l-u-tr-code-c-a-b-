<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu ứng ảnh tương tác</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            margin: 0;
            overflow: hidden;
        }

        /* Khung chứa tạo chiều sâu 3D */
        .card-container {
            perspective: 1000px;
            width: 300px;
            height: 400px;
        }

        /* Thẻ ảnh chính */
        .card {
            width: 100%;
            height: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="card-container" id="cardContainer">
        <div class="card" id="card">
            <!-- Thay link ảnh của bạn vào đây -->
            <img src="https://picsum.photos/300/400" alt="Sample Image">
        </div>
    </div>

    <script>
        const container = document.getElementById('cardContainer');
        const card = document.getElementById('card');

        // --- 1. HIỆU ỨNG TRÊN PC (DI CHUỘT) ---
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left; // Tọa độ X của chuột trong card
            const y = e.clientY - rect.top;  // Tọa độ Y của chuột trong card

            // Tính toán góc nghiêng dựa trên tâm của card
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = -((y - centerY) / centerY) * 20; // Giới hạn góc nghiêng 20 độ
            const rotateY = ((x - centerX) / centerX) * 20;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
        });

        // Khi di chuột ra ngoài, trả ảnh về vị trí cũ
        container.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
            card.style.transition = 'transform 0.5s ease';
        });

        container.addEventListener('mouseenter', () => {
            card.style.transition = 'transform 0.1s ease-out';
        });

        // --- 2. HIỆU ỨNG TRÊN ĐIỆN THOẠI (LẮC / NGHIÊNG ĐTH) ---
        function handleOrientation(e) {
            const beta = e.beta;   // Góc nghiêng trước/sau (-180 đến 180)
            const gamma = e.gamma; // Góc nghiêng trái/phải (-90 đến 90)

            if (beta !== null && gamma !== null) {
                // Giới hạn góc để hiệu ứng mượt mà, không bị lật ngược
                const rotateX = Math.max(-20, Math.min(20, beta));
                const rotateY = Math.max(-20, Math.min(20, gamma));

                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
            }
        }

        // Kiểm tra xem trình duyệt có hỗ trợ cảm biến chuyển động không
        if (window.DeviceOrientationEvent) {
            // Trên các trình duyệt iOS hiện đại (iOS 13+), cần xin quyền truy cập
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                // Bạn có thể tạo một nút bấm (button) để người dùng click và kích hoạt quyền này
                document.body.addEventListener('click', () => {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                            }
                        })
                        .catch(console.error);
                }, { once: true }); // Chỉ chạy 1 lần khi click đầu tiên
            } else {
                // Android và các thiết bị hỗ trợ sẵn
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }
    </script>
</body>
</html>
