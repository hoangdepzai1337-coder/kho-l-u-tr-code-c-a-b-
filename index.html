<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu ứng ảnh tương tác</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Khung chứa tạo chiều sâu 3D */
        .card-container {
            perspective: 1000px;
            width: 280px;
            height: 380px;
            margin-bottom: 20px;
        }

        /* Thẻ ảnh chính */
        .card {
            width: 100%;
            height: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            will-change: transform;
            background: #222;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* Nút chọn ảnh từ máy */
        .upload-btn {
            background-color: #00ffcc;
            color: #121212;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,255,204,0.3);
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card-container" id="cardContainer">
        <div class="card" id="card">
            <!-- Ảnh mặc định ban đầu -->
            <img id="previewImg" src="https://picsum.photos/300/400" alt="Sample Image">
        </div>
    </div>

    <!-- Nút chọn ảnh từ thiết bị -->
    <label for="fileInput" class="upload-btn">Chọn ảnh từ máy</label>
    <input type="file" id="fileInput" accept="image/*">

    <script>
        const container = document.getElementById('cardContainer');
        const card = document.getElementById('card');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');

        // --- XỬ LÝ CHỌN ẢNH TỪ MÁY ---
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previewImg.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // --- 1. HIỆU ỨNG TRÊN PC (DI CHUỘT) ---
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = -((y - centerY) / centerY) * 20;
            const rotateY = ((x - centerX) / centerX) * 20;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
        });

        container.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
            card.style.transition = 'transform 0.5s ease';
        });

        container.addEventListener('mouseenter', () => {
            card.style.transition = 'transform 0.1s ease-out';
        });

        // --- 2. HIỆU ỨNG TRÊN ĐIỆN THOẠI (NGHIÊNG ĐTH) ---
        function handleOrientation(e) {
            const beta = e.beta;   // Nghiêng trước/sau
            const gamma = e.gamma; // Nghiêng trái/phải

            if (beta !== null && gamma !== null) {
                const rotateX = Math.max(-20, Math.min(20, beta));
                const rotateY = Math.max(-20, Math.min(20, gamma));

                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
            }
        }

        if (window.DeviceOrientationEvent) {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.body.addEventListener('click', () => {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                            }
                        })
                        .catch(console.error);
                }, { once: true });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }
    </script>
</body>
</html>
