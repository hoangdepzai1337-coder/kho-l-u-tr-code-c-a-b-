<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kho Code</title>
  <style>
    body {
      background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?w=3840');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .btn {
      padding: 14px 32px;
      font-size: 18px;
      background: rgba(26, 26, 46, 0.8);
      color: #00ffcc;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }
    .btn:hover {
      background: #00ffcc;
      color: #0d0d0d;
      box-shadow: 0 0 20px #00ffcc88;
    }
  </style>
</head>
<body>
  <button class="btn" onclick="alert('thằng nào bấm vào là gay')">
    bấm vào đây
  </button>
</body>
</html>
