<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8"
      <title>Kho code</title>
    <style>
    body {
      background: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .btn {
      padding: 14px 32px;
      font-size: 18px;
      background: #1a1a2e;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: monospace;
    }

    .btn:hover {
      background: #00ffcc;
      color: #0d0d0d;
      box-shadow: 0 0 20px #00ffcc88;
    }
  </style>
</head>
<body>

  <button class="btn" onclick="alert('bấm vào là gay')">
    bấm vào đây
  </button>

</body>
</html>
