<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kho Code</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      font-family: monospace;
    }

    .bg {
      position: fixed;
      top: -20px;
      left: -20px;
      width: calc(100% + 40px);
      height: calc(100% + 40px);
      background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?w=3840');
      background-size: cover;
      background-position: center;
      transition: transform 0.1s ease-out;
      z-index: -1;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      height: 100vh;
      background: rgba(10, 10, 20, 0.75);
      backdrop-filter: blur(12px);
      border-right: 1px solid #00ffcc44;
      display: flex;
      flex-direction: column;
      padding: 24px 12px;
      gap: 8px;
      overflow-y: auto;
    }

    .sidebar.right {
      border-right: none;
      border-left: 1px solid #00ffcc44;
      margin-left: auto;
    }

    .sidebar h2 {
      color: #00ffcc;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #00ffcc33;
    }

    .car-item {
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #00ffcc22;
      cursor: pointer;
      transition: border 0.2s, transform 0.2s;
    }

    .car-item:hover {
      border: 1px solid #00ffcc;
      transform: scale(1.02);
    }

    .car-item img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      display: block;
    }

    .car-item span {
      display: block;
      color: #00ffcc;
      font-size: 11px;
      padding: 6px 8px;
      background: rgba(0,0,0,0.5);
    }

    /* CENTER */
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .title {
      color: #00ffcc;
      font-size: 28px;
      letter-spacing: 4px;
      text-shadow: 0 0 20px #00ffcc88;
    }

    .subtitle {
      color: #ffffff88;
      font-size: 13px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <!-- SIDEBAR TRÁI -->
  <div class="sidebar">
    <h2>🚗 Xe Tao</h2>

    <!-- THÊM XE VÔ ĐÂY — copy cái block này -->
    <div class="car-item">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/2019_Lamborghini_Urus_front_8.15.19.jpg/1280px-2019_Lamborghini_Urus_front_8.15.19.jpg" alt="Lamborghini Urus">
      <span>Lamborghini Urus</span>
    </div>

    <div class="car-item">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/2020_Ferrari_SF90_Stradale%2C_front_8.15.19.jpg/1280px-2020_Ferrari_SF90_Stradale%2C_front_8.15.19.jpg" alt="Ferrari SF90">
      <span>Ferrari SF90</span>
    </div>
    <!-- END XE TRÁI -->

  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="title">KHO CODE</div>
    <div class="subtitle">// by hoangdepzai1337</div>
  </div>

  <!-- SIDEBAR PHẢI -->
  <div class="sidebar right">
    <h2>🏎️ Dream Car</h2>

    <!-- THÊM XE VÔ ĐÂY -->
    <div class="car-item">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/2017_Bugatti_Chiron.jpg/1280px-2017_Bugatti_Chiron.jpg" alt="Bugatti Chiron">
      <span>Bugatti Chiron</span>
    </div>

    <div class="car-item">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/thirty/McLaren_P1_-_Flickr_-_Supermac1961_%282%29.jpg/1280px-McLaren_P1_-_Flickr_-_Supermac1961_%282%29.jpg" alt="McLaren P1">
      <span>McLaren P1</span>
    </div>
    <!-- END XE PHẢI -->

  </div>

  <script>
    const bg = document.getElementById('bg');
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      bg.style.transform = `translate(${x}px, ${y}px)`;
    });
  </script>
</body>
</html>
