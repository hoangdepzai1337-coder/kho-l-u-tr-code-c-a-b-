<div style="color: #fff; font-size: 12px;">Chọn màu chủ đạo:</div>
  <div class="color-options">
    <div class="color-btn" style="background: #00ffcc;" onclick="setThemeColor('#00ffcc')"></div>
    <div class="color-btn" style="background: #3b82f6;" onclick="setThemeColor('#3b82f6')"></div>
    <div class="color-btn" style="background: #ef4444;" onclick="setThemeColor('#ef4444')"></div>
    <div class="color-btn" style="background: #10b981;" onclick="setThemeColor('#10b981')"></div>
    <div class="color-btn" style="background: #a855f7;" onclick="setThemeColor('#a855f7')"></div>
    <div class="color-btn" style="background: #f59e0b;" onclick="setThemeColor('#f59e0b')"></div>
    <div class="color-btn" style="background: #ec4899;" onclick="setThemeColor('#ec4899')"></div>
    <div class="color-btn" style="background: #ffffff;" onclick="setThemeColor('#ffffff')"></div>
  </div>
  <div class="custom-color-row">
    <label>Hoặc chọn màu tùy ý:</label>
    <input type="color" id="custom-color-picker" value="#00ffcc" oninput="setThemeColor(this.value)">
  </div>

  <!-- PHẦN TÙY CHỈNH CHỮ LỚN (TIÊU ĐỀ CHÍNH) -->
  <div class="setting-section-title">🔤 Tùy Chỉnh Chữ Lớn (Kho Code)</div>
  <div class="bg-input-group">
    <label>Nội dung chữ lớn:</label>
    <input type="text" id="setting-title-input" value="KHO CODE" oninput="previewTitle(this.value)">
  </div>
  <div class="bg-actions">
    <div class="btn-bg-cancel" onclick="cancelTitleChanges()">Hủy</div>
    <div class="btn-bg-apply" onclick="applyTitleChanges()">Áp dụng</div>
  </div>

  <!-- PHẦN TÙY CHỈNH ẢNH NỀN NGOÀI -->
  <div class="setting-section-title">🖼️ Tùy Chỉnh Ảnh Nền Ngoài</div>
  <div class="bg-input-group">
    <label>Dán link ảnh (URL):</label>
    <input type="text" id="setting-bg-url" placeholder="https://..." oninput="previewSettingBg(this.value)">
    <img id="setting-bg-preview" class="bg-preview-box" alt="Preview ảnh nền">
  </div>
  <div class="bg-actions">
    <div class="btn-bg-cancel" onclick="cancelBgChanges()">Hủy</div>
    <div class="btn-bg-apply" onclick="applyBgChanges()">Áp dụng</div>
  </div>
</div>
