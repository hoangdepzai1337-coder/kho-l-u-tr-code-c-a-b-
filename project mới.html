<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySpace — Personal Showcase</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #00ffcc;
      --accent-rgb: 0, 255, 204;
      --bg: #050510;
      --bg2: #0a0a1a;
      --bg3: #0f0f22;
      --border: rgba(0,255,204,0.2);
      --text: #e0e0e0;
      --muted: rgba(255,255,255,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOPBAR */
    .topbar {
      height: 52px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 20px; gap: 16px;
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Fira Code', monospace;
      font-size: 16px; font-weight: 600;
      color: var(--accent);
      text-shadow: 0 0 15px rgba(var(--accent-rgb),0.5);
      letter-spacing: 2px;
    }

    .topbar-right {
      margin-left: auto;
      display: flex; align-items: center; gap: 12px;
    }

    .search-box {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      color: var(--text);
      font-family: 'Fira Code', monospace;
      font-size: 12px; outline: none;
      width: 200px;
      transition: border 0.2s;
    }
    .search-box:focus { border-color: var(--accent); }
    .search-box::placeholder { color: var(--muted); }

    .add-btn {
      background: rgba(var(--accent-rgb),0.15);
      border: 1px solid var(--accent);
      border-radius: 8px; padding: 7px 16px;
      color: var(--accent);
      font-family: 'Fira Code', monospace;
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .add-btn:hover { background: rgba(var(--accent-rgb),0.3); }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 14px 16px 8px;
      font-family: 'Fira Code', monospace;
      font-size: 10px; color: var(--muted);
      letter-spacing: 2px; text-transform: uppercase;
      border-bottom: 1px solid rgba(var(--accent-rgb),0.1);
    }

    .menu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
      position: relative;
    }
    .menu-item:hover { background: rgba(var(--accent-rgb),0.05); }
    .menu-item.active {
      background: rgba(var(--accent-rgb),0.1);
      border-left-color: var(--accent);
    }

    .menu-icon { font-size: 18px; }

    .menu-info { flex: 1; }
    .menu-name {
      font-size: 13px; font-weight: 500; color: var(--text);
    }
    .menu-item.active .menu-name { color: var(--accent); }
    .menu-count {
      font-size: 10px; color: var(--muted);
      font-family: 'Fira Code', monospace;
    }

    .menu-badge {
      background: rgba(var(--accent-rgb),0.15);
      border: 1px solid rgba(var(--accent-rgb),0.3);
      border-radius: 10px; padding: 1px 7px;
      font-size: 10px; color: var(--accent);
      font-family: 'Fira Code', monospace;
    }

    /* CONTENT */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      position: relative;
    }

    .content-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .content-title {
      font-size: 22px; font-weight: 700;
    }
    .content-title span { color: var(--accent); }

    .content-subtitle {
      font-size: 12px; color: var(--muted);
      margin-top: 4px;
      font-family: 'Fira Code', monospace;
    }

    /* TABS panel */
    .panel { display: none; }
    .panel.active { display: block; }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      transition: all 0.2s; cursor: pointer;
      position: relative;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(var(--accent-rgb),0.1);
    }

    .card-img {
      width: 100%; height: 160px;
      object-fit: cover;
      background: var(--bg3);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
    }
    .card-img img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .card-body { padding: 14px; }

    .card-tag {
      display: inline-block;
      background: rgba(var(--accent-rgb),0.1);
      border: 1px solid rgba(var(--accent-rgb),0.2);
      border-radius: 4px; padding: 2px 8px;
      font-size: 10px; color: var(--accent);
      font-family: 'Fira Code', monospace;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 14px; font-weight: 600;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 12px; color: var(--muted);
      line-height: 1.6; margin-bottom: 12px;
    }

    .card-footer {
      display: flex; align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 10px;
    }

    .card-meta {
      font-size: 11px; color: var(--muted);
      font-family: 'Fira Code', monospace;
    }

    .card-actions { display: flex; gap: 6px; }

    .btn-icon {
      width: 28px; height: 28px;
      background: rgba(var(--accent-rgb),0.08);
      border: 1px solid rgba(var(--accent-rgb),0.2);
      border-radius: 6px; color: var(--accent);
      font-size: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .btn-icon:hover { background: rgba(var(--accent-rgb),0.25); }
    .btn-icon.del { color: #ff6666; border-color: rgba(255,50,50,0.3); background: rgba(255,50,50,0.08); }
    .btn-icon.del:hover { background: rgba(255,50,50,0.25); }

    /* EMPTY STATE */
    .empty {
      text-align: center; padding: 60px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 14px; }
    .empty-text { font-size: 14px; margin-bottom: 6px; }
    .empty-sub { font-size: 12px; font-family: 'Fira Code', monospace; }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 999; display: none;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 28px;
      width: 90vw; max-width: 500px;
      max-height: 90vh; overflow-y: auto;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity:0; }
      to { transform: translateY(0); opacity:1; }
    }

    .modal-title {
      font-size: 16px; font-weight: 700;
      color: var(--accent); margin-bottom: 20px;
      font-family: 'Fira Code', monospace;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 10px;
      font-weight: 600; color: var(--muted);
      letter-spacing: 1px; text-transform: uppercase;
      margin-bottom: 6px;
      font-family: 'Fira Code', monospace;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--bg3);
      border: 1px solid rgba(var(--accent-rgb),0.2);
      border-radius: 8px; padding: 10px 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px; outline: none;
      transition: border 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--accent); }
    .form-group input::placeholder,
    .form-group textarea::placeholder { color: rgba(255,255,255,0.2); }
    .form-group select option { background: var(--bg3); }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
